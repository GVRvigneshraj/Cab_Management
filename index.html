<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GreenCab Enterprise</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);min-height:100vh;min-height:100dvh;overflow:hidden}
:root{--p:#4f6ef7;--pd:#3b54c4;--pdd:#2d3fa0;--pdp:#1e2d7a;--pl:#818cf8;--plr:#a5b4fc;--pbg:#eef2ff;--psf:#c7d2fe;--ac:#f59e0b;--acl:#fef3c7;--dn:#ef4444;--dnl:#fee2e2;--bg:#f1f5f9;--cd:#fff;--tx:#1e293b;--t2:#475569;--tm:#94a3b8;--bd:#e2e8f0}
.ph{width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;position:relative}
.notch{display:none}
.sb{height:54px;padding:14px 28px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--tx);position:relative;z-index:50;transition:color .3s}
.sb.w{color:#fff}
.sc{position:absolute;top:54px;left:0;right:0;bottom:0;overflow:hidden}
.sr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .32s;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sr::-webkit-scrollbar{display:none}
.sr.on{transform:translateX(0);opacity:1;z-index:10}
.sr.lt{transform:translateX(-30%);opacity:0;z-index:5}
.sr.rt{transform:translateX(100%);opacity:0;z-index:5}
.bn{position:absolute;bottom:0;left:0;right:0;height:72px;background:var(--cd);border-top:1px solid var(--bd);display:none;align-items:flex-start;padding-top:6px;z-index:50}
.bn.v{display:flex}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;position:relative}
.ni .material-icons-round{font-size:24px;color:var(--tm);transition:color .2s}
.ni span{font-size:10px;font-weight:600;color:var(--tm);transition:color .2s}
.ni.a .material-icons-round,.ni.a span{color:var(--p)}
.nd{width:8px;height:8px;background:var(--dn);border-radius:50%;position:absolute;top:0;right:calc(50% - 18px);border:2px solid var(--cd)}
.bp{width:100%;height:52px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s;box-shadow:0 4px 14px rgba(79,110,247,.3);display:flex;align-items:center;justify-content:center;gap:8px}
.bp:active{transform:scale(.97)}
.bp.dn{background:linear-gradient(135deg,var(--dn),#b91c1c);box-shadow:0 4px 14px rgba(239,68,68,.3)}
.bs{width:100%;height:48px;background:var(--pbg);color:var(--pd);border:1.5px solid var(--psf);border-radius:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
.bs:active{background:var(--psf)}
.bsm{height:36px;padding:0 16px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.bsm:active{transform:scale(.96)}
.bsm.g{background:var(--p);color:#fff}
.bsm.ol{background:transparent;border:1.5px solid var(--p);color:var(--p)}
.cd{background:var(--cd);border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--bd)}
.bg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bg.gn{background:#ecfdf5;color:#047857}
.bg.am{background:#fef3c7;color:#92400e}
.bg.rd{background:#fee2e2;color:#dc2626}
.bg.gy{background:#f1f5f9;color:#64748b}
.bg.bl{background:#dbeafe;color:#1e40af}
.tst{position:absolute;top:60px;left:16px;right:16px;padding:14px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:200;transform:translateY(-120%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;gap:10px;cursor:pointer}
.tst.sh{transform:translateY(0)}
.tst.ok{background:#047857;color:#fff}
.tst.er{background:#991b1b;color:#fff}
.tst.in{background:#1e3a5f;color:#fff}
.tst .tc{margin-left:auto;opacity:.7;font-size:18px;flex-shrink:0}
.tst .tc:hover{opacity:1}
.ig{position:relative;margin-bottom:14px}
.ig label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:6px}
.ig input,.ig select{width:100%;height:48px;border:1.5px solid var(--bd);border-radius:12px;padding:0 44px 0 16px;font-size:14px;font-family:inherit;color:var(--tx);background:var(--cd);transition:border-color .2s,box-shadow .2s;outline:none}
.ig input:focus,.ig select:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
.ig .ii{position:absolute;right:14px;top:calc(50% + 10px);transform:translateY(-50%);color:var(--tm);font-size:20px;pointer-events:none}
.rt{display:flex;background:var(--pbg);border-radius:12px;padding:4px;gap:4px}
.rt button{flex:1;height:44px;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .25s;background:transparent;color:var(--t2)}
.rt button.a{background:var(--p);color:#fff;box-shadow:0 2px 8px rgba(79,110,247,.3)}
.pb{height:6px;background:var(--psf);border-radius:3px;overflow:hidden}
.pb .fl{height:100%;background:linear-gradient(90deg,var(--p),var(--pl));border-radius:3px;transition:width .5s}
.li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
.li:last-child{border-bottom:none}
.avc{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0}
.gh{background:linear-gradient(135deg,#2d3fa0 0%,#3b54c4 40%,#4f6ef7 100%);color:#fff;position:relative;overflow:hidden}
.gh::before{content:'';position:absolute;top:-40%;right:-20%;width:200px;height:200px;background:rgba(255,255,255,.08);border-radius:50%}
.gh::after{content:'';position:absolute;bottom:-30%;left:-10%;width:150px;height:150px;background:rgba(255,255,255,.05);border-radius:50%}
@keyframes fiu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes sgr{0%,100%{box-shadow:0 0 0 0 rgba(79,110,247,.35)}70%{box-shadow:0 0 0 12px rgba(79,110,247,0)}}
.ai{animation:fiu .4s ease forwards}
.ai2{animation:fiu .4s ease .08s forwards;opacity:0}
.ai3{animation:fiu .4s ease .16s forwards;opacity:0}
.ai4{animation:fiu .4s ease .24s forwards;opacity:0}
.prs{animation:sgr 2s infinite}
.sw{width:48px;height:26px;background:#cbd5e1;border-radius:13px;position:relative;cursor:pointer;transition:background .25s;flex-shrink:0}
.sw.on{background:var(--p)}
.sw::after{content:'';width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw.on::after{transform:translateX(22px)}
@media(min-width:768px){
body{background:linear-gradient(135deg,#c7d2fe 0%,#e0e7ff 50%,#ede9fe 100%)}
.ph{max-width:480px;margin:0 auto;height:100vh;height:100dvh;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.05)}
}
@media(max-width:767px){
.sb{height:env(safe-area-inset-top,48px);padding-top:env(safe-area-inset-top,10px)}.sc{top:env(safe-area-inset-top,48px)}.bn{height:calc(72px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
}
</style>
</head>
<body>
<div class="ph" id="ph">
<div class="sb" id="sb"><span>9:41</span><div style="display:flex;gap:5px;align-items:center"><span class="material-icons-round" style="font-size:15px">signal_cellular_alt</span><span class="material-icons-round" style="font-size:15px">wifi</span><span class="material-icons-round" style="font-size:15px">battery_full</span></div></div>
<div class="sc" id="sc"><div class="sr on" id="sA"></div><div class="sr rt" id="sB"></div></div>
<div class="bn" id="bn"></div>
<div class="tst" id="tst"></div>
</div>
<script>
/* ============ CONFIG ============ */
var API_URL='https://script.google.com/macros/s/AKfycbxX07yYy5yVHC8vchmDCFRD2Wry0S7htRsvJDQrr4Vvdl7UZVIGlXQWaRmeninQoNwk/exec';

/* ============ API HELPER ============ */
function apiCall(action,data){
var payload=Object.assign({action:action},data||{});
return fetch(API_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)})
.then(function(r){return r.text()}).then(function(t){try{return JSON.parse(t)}catch(e){return{success:false,error:'Invalid server response'}}})
.catch(function(e){return{success:false,error:'Network error: '+e.toString()}});
}
function apiGet(params){
var qs=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');
return fetch(API_URL+'?'+qs).then(function(r){return r.json()}).catch(function(e){return{success:false,error:e.toString()}});
}

/* ============ DATA ============ */
var D = {
cars:[],
drivers:[],
dutyHistory:[],
notifications:[],
advances:[],
transactions:[]
};

/* ============ STATE ============ */
var S = {
role:'driver', screen:'welcome', hist:[], user:null,
notifOn:false,
dutyOn:false, duty:null,
_viewCarId:null, _viewDrvId:null, _settleDrvId:null, _lastReport:null,
_giveAdvDrvId:null
};

/* ============ LOAD DATA FROM API ============ */
function loadData(){
if(!S.user)return Promise.resolve();
return apiCall('getData',{userId:S.user.id,role:S.role}).then(function(r){
if(r.success){
D.drivers=r.drivers||[];
D.cars=r.cars||[];
D.dutyHistory=r.dutyHistory||[];
D.advances=r.advances||[];
D.transactions=r.transactions||[];
D.notifications=r.notifications||[];
}
return r;
});
}

/* ============ SESSION ============ */
function saveSession(){
try{localStorage.setItem('gc_user',JSON.stringify(S.user));localStorage.setItem('gc_role',S.role)}catch(e){}
}
function loadSession(){
try{var u=localStorage.getItem('gc_user');var r=localStorage.getItem('gc_role');if(u){S.user=JSON.parse(u);S.role=r||'driver';return true}}catch(e){}
return false;
}
function clearSession(){
try{localStorage.removeItem('gc_user');localStorage.removeItem('gc_role')}catch(e){}
}

/* ============ NAV ============ */
var sA=document.getElementById('sA'),sB=document.getElementById('sB');
var layer='A';
function nav(id,push){
if(typeof push==='undefined')push=true;
if(push&&S.screen!==id)S.hist.push(S.screen);
S.screen=id;
var h=renderScreen(id);
var ent=layer==='A'?sB:sA;
var lev=layer==='A'?sA:sB;
ent.innerHTML=h;
ent.className='sr rt';
lev.className='sr lt';
requestAnimationFrame(function(){ent.className='sr on';layer=layer==='A'?'B':'A'});
uNav(id);uBN(id);ent.scrollTop=0;
}
function back(){
if(!S.hist.length)return;
var p=S.hist.pop();S.screen=p;
var h=renderScreen(p);
var ent=layer==='A'?sB:sA;
var lev=layer==='A'?sA:sB;
ent.innerHTML=h;
ent.className='sr lt';
lev.className='sr rt';
requestAnimationFrame(function(){ent.className='sr on';layer=layer==='A'?'B':'A'});
uNav(p);uBN(p);
}
function uNav(id){document.getElementById('sb').className='sb'+(id==='welcome'?' w':'')}
function uBN(id){
var bn=document.getElementById('bn');
var auth=['welcome','login','registerDriver','registerOwner'];
if(auth.indexOf(id)!==-1||!S.user){bn.classList.remove('v');return}
bn.classList.add('v');
var tabs;
if(S.role==='driver'){
tabs=[{i:'driverDash',ic:'dashboard',l:'Home'},{i:'activeDuty',ic:'route',l:'Duty'},{i:'earningsDriver',ic:'account_balance_wallet',l:'Earnings'},{i:'profile',ic:'person',l:'Profile'}];
}else{
tabs=[{i:'ownerDash',ic:'dashboard',l:'Home'},{i:'vehicleList',ic:'directions_car',l:'Fleet'},{i:'driverList',ic:'people',l:'Drivers'},{i:'revenueOwner',ic:'attach_money',l:'Revenue'},{i:'profile',ic:'person',l:'Profile'}];
}
var unread=S.notifOn?D.notifications.filter(function(n){return!n.read}).length:0;
var html='';
for(var t=0;t<tabs.length;t++){
var tb=tabs[t];
var cls='ni'+(S.screen===tb.i?' a':'');
var dot=tb.i==='notifScreen'&&unread>0?'<div class="nd"></div>':'';
html+='<div class="'+cls+'" onclick="nav(\''+tb.i+'\',false)">'+dot+'<span class="material-icons-round">'+tb.ic+'</span><span>'+tb.l+'</span></div>';
}
bn.innerHTML=html;
}
var _toastTimer=null;
function toast(m,t){
if(!t)t='ok';
var e=document.getElementById('tst');
var ic={ok:'check_circle',er:'error',in:'info'};
e.className='tst '+t;
e.innerHTML='<span class="material-icons-round" style="font-size:20px">'+ic[t]+'</span><span>'+m+'</span><span class="material-icons-round tc" onclick="closeToast()">close</span>';
requestAnimationFrame(function(){e.classList.add('sh')});
if(_toastTimer)clearTimeout(_toastTimer);
_toastTimer=setTimeout(function(){closeToast()},2000);
}
function closeToast(){
var e=document.getElementById('tst');
e.classList.remove('sh');
if(_toastTimer){clearTimeout(_toastTimer);_toastTimer=null}
}

/* ============ HELPERS ============ */
function getCar(id){for(var i=0;i<D.cars.length;i++){if(String(D.cars[i].id)===String(id))return D.cars[i]}return null}
function getDriver(id){for(var i=0;i<D.drivers.length;i++){if(String(D.drivers[i].id)===String(id))return D.drivers[i]}return null}
function fmt(n){return '\u20B9'+Number(n).toLocaleString('en-IN')}
function dutyCalc(){
var d=S.duty;if(!d)return null;
var te=0;for(var i=0;i<d.trips.length;i++)te+=d.trips[i].fare;
var fc=0;for(var i=0;i<d.fuelEntries.length;i++)fc+=d.fuelEntries[i].cost;
var ex=0;for(var i=0;i<d.expenses.length;i++)ex+=d.expenses[i].amount;
var fn=0;for(var i=0;i<d.fines.length;i++)fn+=d.fines[i].amount;
var car=getCar(d.carId);if(!car)return null;
var dg=Math.round(te*car.driverPct/100);
var os=te-dg;
var dn=dg-fc-ex-fn;
return{totalEarnings:te,fuelCost:fc,expenses:ex,fines:fn,driverPct:car.driverPct,driverGross:dg,ownerShare:os,driverNet:dn};
}

/* ============ RENDER MAP (FIXED) ============ */
function renderScreen(id){
var m={
welcome:rWelcome,login:rLogin,registerDriver:rRegDrv,registerOwner:rRegOwn,
driverDash:rDrvDash,startDuty:rStartDuty,activeDuty:rActiveDuty,
addFuel:rAddFuel,addExpense:rAddExp,endDuty:rEndDuty,
dutyReport:rDutyReport,earningsDriver:rDrvEarn,notifScreen:rNotif,profile:rProfile,
ownerDash:rOwnDash,vehicleList:rVehList,carDetailOwn:rCarOwn,addCar:rAddCar,
carSettings:rCarSet,driverList:rDrvList,drvDetailOwn:rDrvOwn,settleDriver:rSettle,
revenueOwner:rRevenueOwner,serviceManage:rServiceManage,
giveAdvance:rGiveAdvance,advanceHistory:rAdvanceHistory,recentActivity:rRecentActivity
};
var fn=m[id];
if(fn)return fn();
return rWelcome();
}

/* --- WELCOME --- */
function rWelcome(){
return'<div style="height:100%;background:linear-gradient(160deg,#1e2d7a 0%,#3b54c4 35%,#4f6ef7 65%,#818cf8 100%);display:flex;flex-direction:column;justify-content:space-between;padding:40px 28px 48px;position:relative;overflow:hidden"><div style="position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)"></div><div style="position:absolute;bottom:-40px;left:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05)"></div><div class="ai" style="position:relative;z-index:2"><div style="width:72px;height:72px;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:32px;border:1px solid rgba(255,255,255,.15)"><span class="material-icons-round" style="font-size:36px;color:#fff">local_taxi</span></div><h1 style="font-size:34px;font-weight:900;color:#fff;line-height:1.15;margin-bottom:12px">GreenCab</h1><p style="font-size:15px;color:rgba(255,255,255,.7);line-height:1.6;max-width:280px">Enterprise Fleet Management \u2014 Simple. Fast. Efficient.</p></div><div class="ai2" style="position:relative;z-index:2"><button class="bp" style="height:56px;font-size:16px;border-radius:16px;background:rgba(255,255,255,.95);color:#1e2d7a;box-shadow:0 8px 24px rgba(0,0,0,.15)" onclick="nav(\'login\')">Get Started <span class="material-icons-round" style="font-size:20px">arrow_forward</span></button><p style="text-align:center;font-size:12px;color:rgba(255,255,255,.45);margin-top:14px">Complete Fleet Control at Your Fingertips</p></div></div>';
}

/* --- LOGIN --- */
function rLogin(){
return'<div style="padding:8px 20px 100px"><div class="ai" style="margin-bottom:24px"><button onclick="back()" style="background:none;border:none;cursor:pointer"><span class="material-icons-round" style="font-size:24px;color:var(--tx)">arrow_back</span></button></div><div class="ai2"><h2 style="font-size:26px;font-weight:900;color:var(--tx);margin-bottom:4px">Welcome Back</h2><p style="font-size:14px;color:var(--t2);margin-bottom:24px">Sign in to your account</p><div class="rt" style="margin-bottom:24px"><button class="'+(S.role==='driver'?'a':'')+'" onclick="S.role=\'driver\';nav(\'login\',false)"><span class="material-icons-round" style="font-size:18px;vertical-align:middle;margin-right:4px">drive_eta</span>Driver</button><button class="'+(S.role==='owner'?'a':'')+'" onclick="S.role=\'owner\';nav(\'login\',false)"><span class="material-icons-round" style="font-size:18px;vertical-align:middle;margin-right:4px">business</span>Owner</button></div><div class="ig"><label>Email</label><input type="email" id="le" placeholder="you@example.com"><span class="material-icons-round ii">mail</span></div><div class="ig"><label>Password</label><input type="password" id="lp" placeholder="Enter password"><span class="material-icons-round ii">lock</span></div><div style="text-align:right;margin-bottom:24px"><a href="#" onclick="toast(\'Reset link sent\',\'in\');return false" style="font-size:13px;font-weight:600;color:var(--pd);text-decoration:none">Forgot Password?</a></div><button class="bp" onclick="doLogin()">LOGIN</button><div style="text-align:center;margin-top:20px"><span style="font-size:13px;color:var(--tm)">New here? </span><a href="#" onclick="nav(\'register'+(S.role==='driver'?'Driver':'Owner')+'\');return false" style="font-size:13px;font-weight:700;color:var(--pd);text-decoration:none">Register</a></div></div></div>';
}
function doLogin(){
var eEl=document.getElementById('le'),pEl=document.getElementById('lp');
var e=eEl?eEl.value.trim():'',p=pEl?pEl.value.trim():'';
if(!e||!p){toast('Fill all fields','er');return}
toast('Logging in...','in');
apiCall('login',{email:e,password:p,role:S.role}).then(function(r){
if(!r.success){toast(r.error||'Login failed','er');return null}
S.user=r.user;
saveSession();
return loadData();
}).then(function(r){
if(!r)return;
toast('Welcome back!','ok');
setTimeout(function(){nav(S.role==='driver'?'driverDash':'ownerDash')},400);
}).catch(function(err){
toast('Login failed: '+err.toString(),'er');
});
}

/* --- REGISTER DRIVER --- */
function rRegDrv(){
return'<div style="padding:8px 20px 100px"><div class="ai"><button onclick="back()" style="background:none;border:none;cursor:pointer"><span class="material-icons-round" style="font-size:24px;color:var(--tx)">arrow_back</span></button></div><div class="ai2"><h2 style="font-size:24px;font-weight:900;color:var(--tx);margin-bottom:4px">Driver Registration</h2><p style="font-size:13px;color:var(--t2);margin-bottom:20px">Create your driver account</p><div class="ig"><label>Full Name</label><input type="text" id="regDrvName" placeholder="Enter full name"><span class="material-icons-round ii">person</span></div><div class="ig"><label>Email</label><input type="email" id="regDrvEmail" placeholder="you@example.com"><span class="material-icons-round ii">mail</span></div><div class="ig"><label>Phone</label><input type="tel" id="regDrvPhone" placeholder="+91 XXXXX XXXXX"><span class="material-icons-round ii">phone</span></div><div class="ig"><label>License Number</label><input type="text" id="regDrvLic" placeholder="DL-XXXXXXXXXX"><span class="material-icons-round ii">badge</span></div><div class="ig"><label>Password</label><input type="password" id="regDrvPass" placeholder="Min 8 characters"><span class="material-icons-round ii">lock</span></div><div style="display:flex;align-items:center;gap:8px;margin-bottom:20px"><input type="checkbox" style="accent-color:var(--p)"><label style="font-size:12px;color:var(--t2)">I agree to the <a href="#" style="color:var(--pd);font-weight:600;text-decoration:none">Terms</a></label></div><button class="bp" onclick="doRegDriver()">CREATE ACCOUNT</button></div></div>';
}

/* --- REGISTER OWNER --- */
function rRegOwn(){

function doStartDuty(){

if(!km||isNaN(fl)){toast('Fill all fields','er');return}
var car=getCar(cid);if(!car){toast('Select a car','er');return}
toast('Starting duty...','in');
apiCall('startDuty',{driverId:S.user.id,carId:cid,startKm:km,startFuel:fl,driverPct:car.driverPct}).then(function(r){
if(!r.success){toast(r.error||'Failed','er');return}
return loadData();
}).then(function(){
S.dutyOn=true;
var car2=getCar(cid);
S.duty={carId:cid,driverId:S.user.id,startKm:km,startFuel:fl,startTime:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),trips:[],fuelEntries:[],expenses:[],fines:[]};

});
}

/* --- ADD FUEL --- */
function rAddFuel(){return'<div style="padding:8px 20px 100px"><div class="ai" style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><button onclick="back()" style="background:none;border:none;cursor:pointer"><span class="material-icons-round" style="font-size:24px;color:var(--tx)">arrow_back</span></button><h2 style="font-size:20px;font-weight:900;color:var(--tx)">Add Fuel</h2></div><div class="ai2"><div class="ig"><label>Liters Filled</label><input type="number" id="afLit" placeholder="e.g. 25" step="0.1"><span class="material-icons-round ii">water_drop</span></div><div class="ig"><label>Total Cost (Rs.)</label><input type="number" id="afCost" placeholder="e.g. 2350"><span class="material-icons-round ii">currency_rupee</span></div><div class="ig"><label>Fuel Station</label><input type="text" id="afSta" placeholder="e.g. HP Pump, MG Road"><span class="material-icons-round ii">location_on</span></div><button class="bp" onclick="doAddFuel()">ADD FUEL ENTRY</button></div></div>'}
function doAddFuel(){var l=parseFloat(document.getElementById('afLit').value),c=parseFloat(document.getElementById('afCost').value),s=document.getElementById('afSta').value;if(!l||!c||!s){toast('Fill all fields','er');return}
var dutyId=S._lastDutyId||0;
if(!dutyId){for(var i=0;i<D.dutyHistory.length;i++){if(D.dutyHistory[i].status==='pending'&&D.dutyHistory[i].driverId===(S.user?S.user.id:0)){dutyId=D.dutyHistory[i].id;break}}}
if(!dutyId){toast('No active duty','er');return}
toast('Saving...','in');
apiCall('addFuel',{dutyId:dutyId,liters:l,cost:c,station:s}).then(function(r){
if(!r.success){toast(r.error||'Failed','er');return}
S.duty.fuelEntries.push({liters:l,cost:c,station:s});
return loadData();
}).then(function(){toast('Fuel entry saved! -'+fmt(c),'ok');back()});

/* --- ADD CAR --- */
function rAddCar(){return'<div style="padding:8px 20px 100px"><div class="ai" style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><button onclick="back()" style="background:none;border:none;cursor:pointer"><span class="material-icons-round" style="font-size:24px;color:var(--tx)">arrow_back</span></button><h2 style="font-size:20px;font-weight:900;color:var(--tx)">Add New Car</h2></div><div class="ai2"><div style="width:100%;height:120px;background:var(--pbg);border:2px dashed var(--psf);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:20px;cursor:pointer"><span class="material-icons-round" style="font-size:32px;color:var(--p);margin-bottom:4px">add_a_photo</span><span style="font-size:12px;font-weight:600;color:var(--pd)">Upload Photo</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="ig"><label>Make</label><input type="text" placeholder="Toyota"><span class="material-icons-round ii">directions_car</span></div><div class="ig"><label>Model</label><input type="text" placeholder="Camry"><span class="material-icons-round ii">time_to_leave</span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="ig"><label>Year</label><input type="number" placeholder="2024"><span class="material-icons-round ii">calendar_today</span></div><div class="ig"><label>Color</label><input type="text" placeholder="White"><span class="material-icons-round ii">palette</span></div></div><div class="ig"><label>Registration Number</label><input type="text" placeholder="KA 01 AB 1234"><span class="material-icons-round ii">badge</span></div><div class="ig"><label>Fuel Type</label><select><option>Petrol</option><option>Diesel</option><option>CNG</option><option>Electric</option></select><span class="material-icons-round ii">expand_more</span></div><div class="ig"><label>Driver Salary Percentage (%)</label><input type="number" id="acPct" placeholder="e.g. 35" value="35" min="0" max="100"><span class="material-icons-round ii">percent</span></div><div style="padding:12px;background:var(--pbg);border-radius:12px;border:1px solid var(--psf);margin-bottom:20px;display:flex;gap:8px;align-items:flex-start"><span class="material-icons-round" style="font-size:18px;color:var(--p)">info</span><div style="font-size:12px;color:var(--pd);line-height:1.5">Driver gets <b>35%</b> of total trip earnings. Fuel and expenses are deducted from driver\'s share. You keep <b>65%</b>.</div></div><button class="bp" onclick="doAddCar()">ADD VEHICLE</button></div></div>'}
function doAddCar(){
var mk=document.querySelector('#sA input[placeholder="Toyota"],#sB input[placeholder="Toyota"]');
var md=document.querySelector('#sA input[placeholder="Camry"],#sB input[placeholder="Camry"]');
var yr=document.querySelector('#sA input[placeholder="2024"],#sB input[placeholder="2024"]');
var cl=document.querySelector('#sA input[placeholder="White"],#sB input[placeholder="White"]');
var pl=document.querySelector('#sA input[placeholder="KA 01 AB 1234"],#sB input[placeholder="KA 01 AB 1234"]');
var ft=document.querySelector('#sA select,#sB select');
var pct=document.getElementById('acPct');
if(!mk||!mk.value||!md||!md.value||!pl||!pl.value){toast('Fill all required fields','er');return}
toast('Adding car...','in');
apiCall('addCar',{make:mk.value,model:md.value,year:yr?yr.value:'',plate:pl.value,color:cl?cl.value:'',fuel:ft?ft.value:'Petrol',driverPct:pct?parseInt(pct.value):35,addedBy:S.user?S.user.id:''}).then(function(r){
if(!r.success){toast(r.error||'Failed','er');return}
return loadData();
}).then(function(){toast('Vehicle added!','ok');back()});
}

function rCarSet(){var c=getCar(S._viewCarId);if(!c)return'';return'<div style="padding:8px 20px 100px"><div class="ai" style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><button onclick="back()" style="background:none;border:none;cursor:pointer"><span class="material-icons-round" style="font-size:24px;color:var(--tx)">arrow_back</span></button><h2 style="font-size:20px;font-weight:900;color:var(--tx)">Car Settings</h2></div><div class="ai2"><div class="cd" style="margin-bottom:16px;display:flex;gap:12px;align-items:center"><img src="'+c.img+'" style="width:56px;height:40px;border-radius:8px;object-fit:cover"><div><div style="font-size:15px;font-weight:700;color:var(--tx)">'+c.make+' '+c.model+'</div><div style="font-size:12px;color:var(--tm)">'+c.plate+'</div></div></div><div class="ig"><label>Driver Salary Percentage (%)</label><input type="number" id="csPct" value="'+c.driverPct+'" min="0" max="100" oninput="document.getElementById(\'csDv\').textContent=this.value+\'%\';document.getElementById(\'csOv\').textContent=(100-parseInt(this.value)||0)+\'%\'"><span class="material-icons-round ii">percent</span></div><div class="cd" style="margin-bottom:20px;background:var(--pbg);border-color:var(--psf)"><h4 style="font-size:12px;font-weight:700;color:var(--tx);margin-bottom:8px">Salary Split Preview</h4><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:10px;height:10px;background:var(--p);border-radius:3px"></div><span style="font-size:12px;color:var(--t2)">Driver: <b id="csDv">'+c.driverPct+'%</b></span></div><div style="display:flex;align-items:center;gap:10px"><div style="width:10px;height:10px;background:var(--ac);border-radius:3px"></div><span style="font-size:12px;color:var(--t2)">Owner: <b id="csOv">'+(100-c.driverPct)+'%</b></span></div><div class="pb" style="margin-top:10px;height:10px;border-radius:5px;overflow:hidden;display:flex"><div id="csBarD" style="width:'+c.driverPct+'%;background:var(--p);transition:width .3s"></div><div id="csBarO" style="width:'+(100-c.driverPct)+'%;background:var(--ac);transition:width .3s"></div></div></div><button class="bp" onclick="doCarSet('+c.id+')">SAVE SETTINGS</button></div></div>'}
function doCarSet(id){var c=getCar(id),p=parseInt(document.getElementById('csPct').value);if(!p||p<0||p>100){toast('Invalid percentage','er');return}
